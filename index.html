<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElephantinUSB - Secure Offline AI Companion</title>
  <!-- Marked.js for clean Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-sidebar: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    aside { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1.5rem; justify-content: space-between; }
    .sidebar-top { display: flex; flex-direction: column; gap: 1.5rem; }
    .logo-area { display: flex; align-items: center; gap: 0.75rem; }
    .logo-area img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
    .logo-text h2 { font-size: 1.05rem; font-weight: 700; color: var(--accent); letter-spacing: 0.03em; }
    .logo-text p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.1rem; }
    
    .new-chat-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .new-chat-btn:hover { background-color: var(--border-color); border-color: var(--accent); }

    .quick-prompts { display: flex; flex-direction: column; gap: 0.5rem; }
    .quick-prompts span { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; font-weight: 600; }
    .prompt-pill { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.85rem; text-align: left; cursor: pointer; transition: all 0.2s; }
    .prompt-pill:hover { color: var(--text-main); border-color: var(--accent); background-color: rgba(56, 189, 248, 0.05); }

    .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .status-box { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--danger); }
    .status-dot.online { background-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

    /* Main Chat Area */
    main { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-main); position: relative; }
    
    header { padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); background-color: rgba(15, 23, 42, 0.5); backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: center; }
    header h3 { font-size: 1rem; font-weight: 500; color: var(--text-muted); }

    #chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
    
    .message-wrapper { display: flex; width: 100%; max-width: 900px; margin: 0 auto; gap: 1rem; }
    .message-wrapper.user { justify-content: flex-end; }
    .message-wrapper.ai { justify-content: flex-start; }

    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; flex-shrink: 0; }
    .user .avatar { background-color: #0284c7; color: #fff; order: 2; }
    .ai .avatar { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--accent); order: 1; overflow: hidden; }
    .ai .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .message-bubble { max-width: 80%; padding: 1rem 1.25rem; border-radius: 1rem; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
    .user .message-bubble { background-color: #0284c7; color: #fff; border-bottom-right-radius: 0.25rem; order: 1; }
    .ai .message-bubble { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 0.25rem; order: 2; }

    /* Markdown content inside bubbles */
    .message-bubble pre { background: #030712; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; border: 1px solid var(--border-color); }
    .message-bubble code { font-family: monospace; font-size: 0.9em; color: #38bdf8; }
    .message-bubble p { margin-bottom: 0.5rem; }
    .message-bubble p:last-child { margin-bottom: 0; }

    /* Input Footer */
    footer { padding: 1.5rem 2rem; background-color: var(--bg-main); border-top: 1px solid var(--border-color); display: flex; justify-content: center; }
    .input-form { width: 100%; max-width: 900px; display: flex; gap: 0.75rem; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 0.5rem 0.75rem; align-items: center; transition: border-color 0.2s; }
    .input-form:focus-within { border-color: var(--accent); }

    textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 0.95rem; resize: none; outline: none; max-height: 150px; padding: 0.5rem; line-height: 1.4; }
    
    .btn-action { background-color: var(--accent); color: var(--bg-main); border: none; border-radius: 0.5rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.2s; flex-shrink: 0; font-weight: bold; }
    .btn-action:hover { background-color: var(--accent-hover); }
    .btn-action.stop { background-color: var(--danger); color: white; display: none; }
    .btn-action.stop:hover { background-color: var(--danger-hover); }

    .system-error { background-color: #450a0a !important; border-color: #991b1b !important; color: #fca5a5 !important; max-width: 900px; margin: 0 auto; text-align: center; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-top">
      <div class="logo-area">
        <img src="assets/logo.png" alt="ElephantinUSB Logo">
        <div class="logo-text">
          <h2>ElephantinUSB</h2>
          <p>Offline Portable AI</p>
        </div>
      </div>
      
      <button class="new-chat-btn" id="new-chat-btn">
        <span>+</span> New Session
      </button>

      <div class="quick-prompts">
        <span>Quick Topics</span>
        <button class="prompt-pill" data-prompt="Write a C++ PID controller loop for an Arduino robot.">🤖 Arduino PID Controller</button>
        <button class="prompt-pill" data-prompt="Explain core principles of offline data privacy and air-gapping.">🔒 Air-Gap Security</button>
        <button class="prompt-pill" data-prompt="Give me emergency triage steps for power grid failure.">⚡ Emergency Triage</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="status-box">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </aside>

  <!-- Main Chat -->
  <main>
    <header>
      <h3>Model: elephantin-ai (Llama 3.2 3B)</h3>
      <span style="font-size: 0.8rem; color: var(--text-muted);">Secure USB Environment</span>
    </header>

    <div id="chat-container">
      <div class="message-wrapper ai">
        <div class="avatar"><img src="assets/logo.png" alt="AI"></div>
        <div class="message-bubble">
          ElephantinUSB engine initialized. Operating fully offline from your USB drive. How can I assist you today?
        </div>
      </div>
    </div>

    <footer>
      <form class="input-form" id="chat-form">
        <textarea id="user-input" rows="1" placeholder="Type your message... (Shift+Enter for new line)" required></textarea>
        <button type="submit" id="send-btn" class="btn-action" title="Send message">↑</button>
        <button type="button" id="stop-btn" class="btn-action stop" title="Stop generation">■</button>
      </form>
    </footer>
  </main>

  <script>
    const API_ENDPOINT = "http://127.0.0.1:11434/api/chat";
    const MODEL_NAME = "elephantin-ai";

    const chatContainer = document.getElementById("chat-container");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const newChatBtn = document.getElementById("new-chat-btn");

    // Conversation history array for multi-turn memory
    let conversationHistory = [
      { role: "system", content: "You are ElephantinUSB, a wise, reliable, and offline AI companion running locally from a USB drive. Provide direct, accurate, and thoughtful answers." }
    ];

    let currentAbortController = null;

    // Health check loop
    async function checkHealth() {
      try {
        const res = await fetch("http://127.0.0.1:11434/", { method: "GET" });
        if (res.ok) {
          statusDot.className = "status-dot online";
          statusText.textContent = "Engine Ready (Offline)";
        } else throw new Error();
      } catch {
        statusDot.className = "status-dot";
        statusText.textContent = "Offline (Run start.bat)";
      }
    }
    checkHealth();
    setInterval(checkHealth, 5000);

    // Append message to UI
    function appendMessage(text, role) {
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      
      if (role === "user") {
        avatar.textContent = "U";
      } else {
        const img = document.createElement("img");
        img.src = "assets/logo.png";
        img.alt = "AI";
        avatar.appendChild(img);
      }

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      
      if (role === "ai") {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return bubble;
    }

    // New Chat / Reset with backend cache wipe
    newChatBtn.addEventListener("click", async () => {
      try {
        await fetch("http://127.0.0.1:11434/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: MODEL_NAME, prompt: "", keep_alive: 0 })
        });
      } catch (e) {}

      conversationHistory = [
        { role: "system", content: "You are ElephantinUSB, a wise, reliable, and offline AI companion running locally from a USB drive. Provide direct, accurate, and thoughtful answers." }
      ];

      chatContainer.innerHTML = `
        <div class="message-wrapper ai">
          <div class="avatar"><img src="assets/logo.png" alt="AI"></div>
          <div class="message-bubble">
            Session reset and cache cleared. Ready for your next query.
          </div>
        </div>
      `;
    });

    // Quick prompt pills
    document.querySelectorAll(".prompt-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        userInput.value = pill.getAttribute("data-prompt");
        userInput.focus();
      });
    });

    // Stop button handler
    stopBtn.addEventListener("click", () => {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
    });

    // Textarea auto-resize
    userInput.addEventListener("input", function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // Handle Enter key submit
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    // Form Submit & Streaming logic
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = userInput.value.trim();
      if (!prompt) return;

      appendMessage(prompt, "user");
      conversationHistory.push({ role: "user", content: prompt });
      
      userInput.value = "";
      userInput.style.height = 'auto';
      userInput.disabled = true;
      sendBtn.style.display = "none";
      stopBtn.style.display = "flex";

      const aiBubble = appendMessage("", "ai");
      let fullResponseText = "";
      currentAbortController = new AbortController();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: currentAbortController.signal,
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: conversationHistory,
            stream: true,
            options: {
              temperature: 0.2,
              repeat_penalty: 1.15,
              top_k: 40,
              top_p: 0.9,
              num_predict: 512
            }
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}: Server error`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);
              if (parsed.message && parsed.message.content) {
                fullResponseText += parsed.message.content;
                aiBubble.innerHTML = marked.parse(fullResponseText);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              }
            } catch (err) {}
          }
        }

        conversationHistory.push({ role: "assistant", content: fullResponseText });

      } catch (error) {
        if (error.name === "AbortError") {
          aiBubble.innerHTML += " *[Generation stopped by user]*";
        } else {
          aiBubble.className = "message-bubble system-error";
          aiBubble.textContent = `Connection Error: ${error.message}`;
        }
      } finally {
        currentAbortController = null;
        userInput.disabled = false;
        sendBtn.style.display = "flex";
        stopBtn.style.display = "none";
        userInput.focus();
      }
    });
  </script>
</body>
</html>
